upstream public_api {
  server 127.0.0.1:4444;
}
upstream mcp_proxy {
  server 127.0.0.1:8080;
}
upstream mcp_inspector {
  server 127.0.0.1:6274;
}
upstream hydra_headless_ts {
  server 127.0.0.1:3000;
}

server {
  listen 8888;
  server_name {server_name};
  add_header 'Access-Control-Allow-Credentials' 'true';
  # Composed by the app (not proxied straight to Hydra) so it can advertise
  # CIMD support alongside Hydra's native fields — see routes/discovery-fp.ts.
  location = /.well-known/oauth-authorization-server {
    proxy_pass http://hydra_headless_ts;
  }
  location = /.well-known/oauth-protected-resource {
    proxy_pass http://public_api/.well-known/openid-configuration;
  }

  # oauth2/auth and oauth2/token are handled by the application.
  ## oauth2/auth is proxied
  ## oauth2/token is handled in the controller

  location ~ ^/(.well-known|oauth2/sessions|oauth2/revoke|oauth2/fallbacks/consent|oauth2/fallbacks/error|userinfo)/? {
    add_header 'Access-Control-Allow-Credentials' 'true';
    add_header 'Access-Control-Allow-Origin' "$http_origin" always; # Allow all origins
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    add_header 'Vary' 'Origin';

    proxy_pass http://public_api;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header  Host              $host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
    proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
  }

  location / {
    add_header 'Access-Control-Allow-Credentials' 'true';
    add_header 'Access-Control-Allow-Origin' "$http_origin" always; # Allow all origins
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    add_header 'Vary' 'Origin';
    try_files $uri $uri/ @consent-app;
  }
}
