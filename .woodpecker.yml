# Woodpecker CI (arm64) — faithful port of .drone.yml onto the arm64 agents.
#
# Differences from .drone.yml are portability fixes only, no build-behavior changes:
#   * the drone `pull-images` step (jeffdyke/ecr-auth-v2) is gone — the Woodpecker agent
#     authenticates to ECR itself, so steps just pull their own image (pull: true).
#   * images are the :latest-arm64 tags built by the oddjob arm64 pipeline.
#   * host volumes use Woodpecker's inline host:container form, and the drone cache dir
#     /var/lib/drone/cache becomes /var/lib/woodpecker/cache.
#   * commands reference shell vars in the bare $VAR form. The brace form is expanded by
#     envsubst over the raw file BEFORE the YAML is parsed, and anything not in the
#     pipeline-metadata env either blanks out or fails the whole config to compile.
#   * Woodpecker has no `changed` build status, so notify fires on failure only.
#
# NOTE: this pipeline needs the repo marked TRUSTED in Woodpecker for the docker.sock and
# host-cache mounts, and an arm64 agent registered with label platform=linux/arm64.

when:
  # Workflow-wide filter, inherited by every step — covers the steps that carry no when of
  # their own and gives the status-only when on notify its event filter.
  - event: [push, pull_request]
    branch: RC

labels:
  platform: linux/arm64

concurrency:
  limit: 3

workspace:
  base: /src
  path: hydra-headless-ts

steps:
  - name: init-build
    image: ruby:3-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/woodpecker/cache:/cache
    environment:
      CI: "true"
    commands:
      # Woodpecker exposes CI_* built-ins; export the DRONE_* names this step echoes.
      - export DRONE_AGENT_NAME="$CI_MACHINE" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER"
      - |
        echo "Agent: $DRONE_AGENT_NAME"
        echo "Build Number: $DRONE_BUILD_NUMBER"
        echo $DRONE_BUILD_NUMBER > /cache/build.txt

  - name: base-install
    image: &build-image 668874212870.dkr.ecr.us-east-1.amazonaws.com/drone-hydra-headless-ts:latest-arm64
    pull: true
    commands:
      - pwd && ls -la
      - bash +x build/rebuild.sh --ci
    depends_on:
      - init-build

  - name: run-tests
    image: *build-image
    pull: true
    commands:
      - npm run test:ci
    depends_on:
      - base-install
      - init-build

  - name: build-and-push
    image: *build-image
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - $PWD/build/rebuild.sh --ci
    depends_on:
      - run-tests
      - base-install
      - init-build

  - name: notify
    # drillster/drone-email is published as a single linux/amd64 manifest -- not a
    # manifest list -- so it cannot be pulled on an arm64 agent at all. It was only
    # ever an SMTP sender to the internal relay, so msmtp does the same job on any
    # arch, with no credential (the relay is unauthenticated on the LAN).
    image: alpine:3
    pull: true
    environment:
      SMTP_HOST: prodsalt.bondlink.vpc
      SMTP_PORT: "25"
      MAIL_FROM: bldeploy@bondlink.com
    commands:
      - apk add --no-cache msmtp git
      - |
        to="$CI_COMMIT_AUTHOR_EMAIL"
        [ -n "$to" ] || to="$(git show -s --format='%aE' HEAD)"
        [ -n "$to" ] || to="$MAIL_FROM"
        # Woodpecker exposes no current-pipeline status; this step only runs on
        # failure, so the subject says so outright.
        {
          printf 'From: %s\n' "$MAIL_FROM"
          printf 'To: %s\n' "$to"
          printf 'Subject: [woodpecker] FAILED %s build #%s (%s)\n' \
            "$CI_REPO" "$CI_PIPELINE_NUMBER" "$CI_COMMIT_BRANCH"
          printf '\n'
          printf 'Repository: %s\n' "$CI_REPO"
          printf 'Branch:     %s\n' "$CI_COMMIT_BRANCH"
          printf 'Commit:     %s\n' "$CI_COMMIT_SHA"
          printf 'Author:     %s\n' "$CI_COMMIT_AUTHOR"
          printf 'Event:      %s\n' "$CI_PIPELINE_EVENT"
          printf 'Build:      %s\n' "$CI_PIPELINE_URL"
          printf '\n%s\n' "$CI_COMMIT_MESSAGE"
        } | msmtp --host="$SMTP_HOST" --port="$SMTP_PORT" --from="$MAIL_FROM" \
              --auth=off --tls=off -- "$to"
    when:
      - status: [failure]
